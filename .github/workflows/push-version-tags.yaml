name: Push version tags

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  push-version-tags:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Push Version Tags
        uses: ovsds/push-version-tags-action@75ca005d4770f90fb04ade9db819e2773c5c0805 # v1.4.1
        with:
          version: ${{ github.event.release.tag_name }}
