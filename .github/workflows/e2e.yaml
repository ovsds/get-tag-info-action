name: E2E

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  e2e-default:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Run
        id: test-run
        uses: $/
        with:
          tag_name: v1.0.0

      - name: Assert exists
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.test-run.outputs.exists }}
          expected: "true"

      - name: Assert tag name
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.test-run.outputs.tag_name }}
          expected: "v1.0.0"

      - name: Assert tag sha
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.test-run.outputs.tag_sha }}
          expected: "c039c53e2ffb5bb54ebdb13189b4c23e7cba15e2"

      - name: Assert tag type
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.test-run.outputs.tag_type }}
          expected: "commit"

      - name: Assert commit sha
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.test-run.outputs.commit_sha }}
          expected: "c039c53e2ffb5bb54ebdb13189b4c23e7cba15e2"

      - name: Assert tag message
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.test-run.outputs.tag_message }}
          expected: "feat: initial commit (#1)\n\n* feat: init from template\r\n\r\n* feat: initial"

      - name: Assert verified
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.test-run.outputs.verified }}
          expected: "true"

  e2e-unverified-commit-type:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Run
        id: test-run
        uses: $/
        with:
          tag_name: unverified_tag

      - name: Assert exists
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.test-run.outputs.exists }}
          expected: "true"

      - name: Assert tag name
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.test-run.outputs.tag_name }}
          expected: "unverified_tag"

      - name: Assert tag sha
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.test-run.outputs.tag_sha }}
          expected: "518c2e81cd748430d589f760efa3b0847d1e1c3d"

      - name: Assert tag type
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.test-run.outputs.tag_type }}
          expected: "commit"

      - name: Assert commit sha
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.test-run.outputs.commit_sha }}
          expected: "518c2e81cd748430d589f760efa3b0847d1e1c3d"

      - name: Assert tag message
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.test-run.outputs.tag_message }}
          expected: "unverified_commit"

      - name: Assert verified
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.test-run.outputs.verified }}
          expected: "false"

  e2e-not-exists:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Run
        id: test-run
        uses: $/
        with:
          tag_name: definitely-not-a-tag

      - name: Assert exists
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.test-run.outputs.exists }}
          expected: "false"

      - name: Assert tag name
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.test-run.outputs.tag_name }}
          expected: ""

      - name: Assert tag sha
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.test-run.outputs.tag_sha }}
          expected: ""

      - name: Assert tag type
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.test-run.outputs.tag_type }}
          expected: ""

      - name: Assert commit sha
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.test-run.outputs.commit_sha }}
          expected: ""

      - name: Assert tag message
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.test-run.outputs.tag_message }}
          expected: ""

      - name: Assert verified
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.test-run.outputs.verified }}
          expected: ""

  e2e-no-partial-match:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Run
        id: test-run
        uses: $/
        with:
          tag_name: v

      - name: Assert exists
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.test-run.outputs.exists }}
          expected: "false"

  e2e:
    runs-on: ubuntu-latest
    if: always() && !cancelled()

    permissions: {}

    needs:
      - e2e-default
      - e2e-unverified-commit-type
      - e2e-not-exists
      - e2e-no-partial-match

    steps:
      - name: Collect Results
        uses: ovsds/collect-needs-result-action@12190e2a1bfe85d9c024f190a3833973e97998f8 # v1.0.0
        with:
          needs_json: ${{ toJson(needs) }}
          skip_allowed: false
